name: checks
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 tools/links.py --check
      - name: sin guion largo
        run: |
          if git ls-files -z '*.md' '*.txt' '*.json' '*.yml' '*.yaml' '*.py' | xargs -0 grep -ln $'\xe2\x80\x94'; then echo "guion largo encontrado"; exit 1; fi
      - name: sin atribución a herramientas en los commits
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$base" ] && git cat-file -e "$base" 2>/dev/null; then range="$base..HEAD"; else range="HEAD~1..HEAD"; fi
          if git log --format=%B "$range" | grep -iE 'co-authored-by|claude-session|generated with'; then echo "atribución encontrada en un commit"; exit 1; fi
